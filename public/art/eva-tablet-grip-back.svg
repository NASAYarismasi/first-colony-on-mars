      <path d="M113 435q-1 24 23 34m-27-41q-1 25 11 31m55 5-9 13" stroke="#5b6b64" stroke-opacity=".6" stroke-width="1.4" stroke-linecap="round"/>
      <g transform="translate(153 485) rotate(30)">
        <rect x="-59" y="-23" width="118" height="48" rx="12" fill="url(#metal)" stroke="#343f43" stroke-width="1.5"/>
        <rect x="-58" y="-12" width="116" height="24" rx="5" fill="url(#ring)"/>
        <path d="M-53-5H53M-53 4H53" stroke="#a5afaa" stroke-opacity=".25"/>
        <path d="M-43-19V19M-33-20V20M34-20V20M44-19V19" stroke="#0a141a" stroke-opacity=".65" stroke-width="3"/>
        <rect x="-15" y="-18" width="30" height="36" rx="3" fill="#465359" stroke="#a2aba3"/>
