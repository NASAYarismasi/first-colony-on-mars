    <linearGradient id="hand" x1="103" y1="346" x2="215" y2="453" gradientUnits="userSpaceOnUse"><stop stop-color="#f7f4e8"/><stop offset=".32" stop-color="#e3e3d9"/><stop offset=".64" stop-color="#b5bdb7"/><stop offset="1" stop-color="#586766"/></linearGradient>
    <linearGradient id="edge" x1="104" y1="396" x2="186" y2="421" gradientUnits="userSpaceOnUse"><stop stop-color="#d7dcd4"/><stop offset=".44" stop-color="#959f99"/><stop offset="1" stop-color="#424f50"/></linearGradient>
    <linearGradient id="metal"><stop stop-color="#222d32"/><stop offset=".1" stop-color="#85918f"/><stop offset=".19" stop-color="#d2d6cb"/><stop offset=".25" stop-color="#505c60"/><stop offset=".41" stop-color="#263238"/><stop offset=".65" stop-color="#48575b"/><stop offset=".84" stop-color="#1b272d"/><stop offset=".93" stop-color="#8a9590"/><stop offset="1" stop-color="#38464a"/></linearGradient>
    <linearGradient id="ring" x2="0" y2="1"><stop stop-color="#111b20"/><stop offset=".28" stop-color="#526167"/><stop offset=".5" stop-color="#243138"/><stop offset=".8" stop-color="#111b22"/><stop offset="1" stop-color="#61706d"/></linearGradient>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 1H4M1 0V4" stroke="#fff" stroke-opacity=".12" stroke-width=".55"/><path d="M0 3H4" stroke="#273b3a" stroke-opacity=".12" stroke-width=".5"/></pattern>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#040a0d" flood-opacity=".45"/></filter>
