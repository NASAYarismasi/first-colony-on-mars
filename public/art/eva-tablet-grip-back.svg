      <path d="M104 402Q106 383 121 382L145 394Q161 410 181 417L184 445 164 470 132 460Q118 450 114 432Z" fill="url(#edge)" stroke="#85918b" stroke-width="1.2"/>
      <path d="M116 408q5-13 15-11m-11 25q10-12 20-6m-11 24q14-12 24-4m-10 20 15-11" stroke="#d7ddd3" stroke-opacity=".47" stroke-width="1.3" stroke-linecap="round"/>
      <g fill="url(#hand)" stroke="#8e9b93" stroke-width="1">
